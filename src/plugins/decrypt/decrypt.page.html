<h4>
    <font size="+2">Securely decrypt and verify messages using
        <a href="https://onlykey.io" target="_blank">OnlyKey</a></font>
</h4>

<fieldset>
    <textarea placeholder="Sender's Keybase username, Protonmail email, or paste their public key..." rows="1" id="pgpkeyurl"></textarea>
    <textarea placeholder="Your Keybase username, Protonmail email, or paste your public key..." rows="1" id="pgpkeyurl2"></textarea>
    <textarea placeholder="PGP message to decrypt ..." id="message"></textarea>
    <button type="submit" id="onlykey_start" value="Decrypt and Verify">Decrypt and Verify</button>
    <div class="messageLink startHidden container-flex"></div>
</fieldset>
<center>
    <form id="action">
        <input type="radio" name="select_one" id="decrypt_and_verify" value="Decrypt and Verify" checked="checked"> Decrypt and Verify 
        <input type="radio" name="select_one" id="decrypt_only" value="Decrypt Only"> Decrypt Only 
        <label class="key-slot-pick" title="Which OnlyKey slot holds your private key. Auto uses RSA slot 1, or ECC slot 1 for an ECC key.">&nbsp; Key slot
            <select id="key_slot"><option value="">Auto (RSA 1 / ECC 1)</option><option value="1">RSA 1</option><option value="2">RSA 2</option><option value="3">RSA 3</option><option value="4">RSA 4</option><option value="101">ECC 1</option><option value="102">ECC 2</option><option value="103">ECC 3</option><option value="104">ECC 4</option><option value="105">ECC 5</option><option value="106">ECC 6</option><option value="107">ECC 7</option><option value="108">ECC 8</option><option value="109">ECC 9</option><option value="110">ECC 10</option><option value="111">ECC 11</option><option value="112">ECC 12</option><option value="113">ECC 13</option><option value="114">ECC 14</option><option value="115">ECC 15</option><option value="116">ECC 16</option></select></label>
        <a href="https://keybase.io/verify" target="_blank">&nbsp;<i class="fa fa-check" aria-hidden="true"></i>&nbsp;Verify</a> </form>
</center>
